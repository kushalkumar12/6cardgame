services:
  - type: web
    name: six-cards-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: APP_PROFILE
        value: prod
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
